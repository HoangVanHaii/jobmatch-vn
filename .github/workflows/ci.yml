name: CI

# Chạy khi push hoặc mở PR vào main / develop.
# Bỏ qua docs/ legal/ README để khỏi tốn runner khi chỉ sửa tài liệu.
on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'

# Cancel job cũ khi push commit mới lên cùng PR — tiết kiệm phút runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Backend — lint + typecheck + test + build
  # ============================================================
  backend:
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]   # LTS hiện tại — khớp với @types/node ^25 / engines Node 22+
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        env:
          # Test env giả — KHÔNG commit secret thật vào workflow.
          NODE_ENV: test
          DATABASE_URL: postgresql://jobmatch:test@localhost:5432/jobmatch_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-test-access-secret-must-be-32-chars-min-len-aaa
          JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-32-chars-min-len
          ENCRYPTION_KEY: ci-test-32-byte-hex-key-for-aes-gcm-aaaaaaaa
          PRINT_TOKEN_SECRET: ci-test-print-token-secret-must-be-32-chars-long
        run: npm test -- --ci --coverage

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ============================================================
  # Frontend — lint + typecheck + test + build
  # ============================================================
  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test -- --run --reporter=verbose

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ============================================================
  # Docker — build image backend (chỉ chạy khi push main, không chạy PR)
  # ============================================================
  docker:
    name: Docker build (backend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]   # chỉ build khi code pass hết
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — chỉ verify Dockerfile hợp lệ)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: jobmatch-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
