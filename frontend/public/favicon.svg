<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Nền gradient xanh dương bo góc -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Vòng cung phía trên: từ trái sang phải -->
  <path d="M14 28 Q14 14 32 14 Q50 14 50 28"
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Đầu mũi tên phải -->
  <path d="M44 21 L52 28 L44 35"
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Vòng cung phía dưới: từ phải sang trái -->
  <path d="M50 36 Q50 50 32 50 Q14 50 14 36"
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Đầu mũi tên trái -->
  <path d="M20 43 L12 36 L20 29"
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Điểm "match" vàng ở trung tâm -->
  <circle cx="32" cy="32" r="4" fill="#facc15"/>
  <circle cx="32" cy="32" r="7" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
